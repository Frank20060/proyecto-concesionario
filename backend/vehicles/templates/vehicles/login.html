{% extends 'vehicles/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block body %}
<div class="login-page">
  <div class="login-box">
    <label class="theme-toggle login-theme-toggle" title="Cambiar tema">
      <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre tema claro y oscuro">
      <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
      <span class="theme-toggle-label">Tema</span>
    </label>
    <h1>Grand Motors</h1>
    <p>Accede al panel de gestión</p>

    {% if form.errors %}
    <ul class="messages">
      <li class="error">Usuario o contraseña incorrectos.</li>
    </ul>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" class="form-input" required autofocus>
      </div>
      <div class="form-group">
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" class="form-input" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
    </form>
  </div>
</div>
<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    toggle.checked = root.dataset.theme === 'dark';
    toggle.addEventListener('change', function () {
      var theme = toggle.checked ? 'dark' : 'light';
      root.dataset.theme = theme;
      localStorage.setItem('gm-admin-theme', theme);
    });
  }());
</script>
{% endblock %}
